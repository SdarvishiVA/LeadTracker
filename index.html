<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VA Capital — Lead Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:wght@400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#F4F6F5; --surface:#FFFFFF; --surface-2:#FAFBFA;
    --line:#E3E7E4; --line-2:#CFD6D1;
    --ink:#0E1512; --ink-2:#41504A; --ink-3:#6E7C76;
    --green:#0F7A43; --green-2:#0B5E33; --green-soft:#E8F4EC;
    --hot:#C2410C; --hot-soft:#FDF0E8;
    --strong:#B45309; --strong-soft:#FCF3E4;
    --mod:#1D5FA8; --mod-soft:#EAF1F9;
    --watch:#6E7C76; --watch-soft:#F0F2F1;
    --shadow:0 1px 2px rgba(14,21,18,.05),0 4px 16px rgba(14,21,18,.05);
    --shadow-lg:0 2px 6px rgba(14,21,18,.06),0 12px 32px rgba(14,21,18,.09);
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --serif:'Libre Baskerville',Georgia,serif;
  }
  *{ box-sizing:border-box; }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
  body{
    font-family:var(--sans); background:var(--bg); color:var(--ink);
    margin:0; font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 clamp(16px,3vw,40px) 100px; }
  .num{ font-variant-numeric:tabular-nums; }
  h1,h2,h3{ margin:0; }

  .topbar{
    background:var(--surface); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:900; box-shadow:0 1px 3px rgba(14,21,18,.04);
  }
  .topbar-in{
    max-width:1180px; margin:0 auto; padding:16px clamp(16px,3vw,40px);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand h1{ font-size:17px; font-weight:700; letter-spacing:-0.01em; }
  .brand .tag{ font-size:12.5px; color:var(--ink-3); }
  .meta-line{ font-size:12px; color:var(--ink-3); display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .demo-flag{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--strong-soft); color:var(--strong);
    font-size:11px; font-weight:600; letter-spacing:0.02em;
    padding:4px 10px; border-radius:20px;
  }
  .demo-flag::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--strong); }

  .refresh-btn{
    font-family:var(--sans); font-size:11.5px; font-weight:600; padding:5px 12px;
    border-radius:20px; border:1px solid var(--line-2); background:var(--surface-2);
    color:var(--ink-2); cursor:pointer;
  }
  .refresh-btn:hover{ background:var(--line); }
  .refresh-btn:disabled{ opacity:.5; cursor:default; }

  .kpis{
    display:grid; grid-template-columns:repeat(4,1fr); gap:14px;
    margin:28px 0 32px;
  }
  .kpi{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow); padding:18px 20px;
  }
  .kpi .label{ font-size:12px; color:var(--ink-3); font-weight:500; margin-bottom:8px; }
  .kpi .value{ font-size:30px; font-weight:700; color:var(--ink); letter-spacing:-0.01em; }
  .kpi .value.accent{ color:var(--green); }
  .kpi .sub{ font-size:12px; color:var(--ink-3); margin-top:4px; }
  .kpi .sub.up{ color:var(--green); font-weight:600; }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow); margin-bottom:22px; overflow:hidden;
  }
  .card-head{
    padding:18px 22px 14px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .card-title{ font-size:14.5px; font-weight:600; }
  .card-body{ padding:20px 22px; }

  .grid-2{ display:grid; grid-template-columns:1.3fr 1fr; gap:20px; }

  table.data{ width:100%; border-collapse:collapse; font-size:13.5px; }
  table.data thead th{
    text-align:right; font-size:11px; font-weight:600; color:var(--ink-3);
    text-transform:uppercase; letter-spacing:0.04em;
    padding:0 0 10px; border-bottom:1px solid var(--line);
  }
  table.data thead th:first-child{ text-align:left; }
  table.data td{
    padding:12px 0; border-bottom:1px solid var(--surface-2);
    text-align:right;
  }
  table.data td:first-child{ text-align:left; font-weight:600; }
  table.data tr:last-child td{ border-bottom:none; }
  table.data tr.total td{ border-top:2px solid var(--line-2); font-weight:700; padding-top:14px; }

  .badge{
    display:inline-block; font-size:12px; font-weight:600; padding:3px 10px; border-radius:20px;
  }
  .badge.good{ background:var(--green-soft); color:var(--green-2); }
  .badge.warn{ background:var(--strong-soft); color:var(--strong); }
  .badge.low{ background:var(--hot-soft); color:var(--hot); }
  .badge.neutral{ background:var(--watch-soft); color:var(--watch); }

  .source-row{
    display:grid; grid-template-columns:150px 1fr 70px 60px;
    align-items:center; gap:14px; padding:10px 0; border-bottom:1px solid var(--surface-2);
    font-size:13px;
  }
  .source-row:last-child{ border-bottom:none; }
  .source-name{ font-weight:600; }
  .bar-track{ height:7px; background:var(--surface-2); border-radius:20px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--green); border-radius:20px; }
  .source-count{ text-align:right; color:var(--ink-3); }
  .source-rate{ text-align:right; font-weight:600; }

  .reason-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 0; border-bottom:1px solid var(--surface-2); font-size:13px;
  }
  .reason-row:last-child{ border-bottom:none; }
  .reason-count{ font-weight:600; color:var(--ink-2); }
  .empty-note{ font-size:12.5px; color:var(--ink-3); font-style:italic; }

  .chart-wrap{ height:230px; }

  .foot{
    text-align:center; font-size:11.5px; color:var(--ink-3); padding-top:8px;
  }

  /* ---------- Range toggle ---------- */
  .range-toggle{
    display:flex; align-items:center; gap:8px; margin:24px 0 0;
    flex-wrap:wrap;
  }
  .range-btn{
    font-family:var(--sans); font-size:12.5px; font-weight:600; padding:7px 16px;
    border-radius:20px; border:1px solid var(--line-2); background:var(--surface);
    color:var(--ink-2); cursor:pointer; transition:all .12s;
  }
  .range-btn:hover{ background:var(--surface-2); }
  .range-btn.active{
    background:var(--green); border-color:var(--green); color:#fff;
  }
  .range-note{ font-size:12px; color:var(--ink-3); margin-left:4px; }

  .summary-line{
    font-size:15px; color:var(--ink-2); margin:14px 2px 0; font-weight:500;
  }
  .summary-line b{ color:var(--ink); font-weight:700; }

  /* ---------- Filters + leads table ---------- */
  .filters{
    display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px;
  }
  .filters select, .filters input{
    font-family:var(--sans); font-size:12.5px; padding:7px 12px; border-radius:8px;
    border:1px solid var(--line-2); background:var(--surface-2); color:var(--ink);
  }
  .filters input{ flex:1; min-width:160px; }
  .filters select{ cursor:pointer; }
  .tablewrap{ overflow:auto; max-height:520px; border:1px solid var(--surface-2); border-radius:8px; }
  table.leads-table{ font-size:12.5px; min-width:760px; }
  table.leads-table thead th{
    position:sticky; top:0; background:var(--surface-2); z-index:2;
    padding:9px 12px; text-align:left; text-transform:none; font-weight:600;
  }
  table.leads-table thead th:not(:first-child){ text-align:left; }
  table.leads-table td{ padding:9px 12px; text-align:left; white-space:nowrap; }
  table.leads-table tbody tr:hover{ background:var(--surface-2); }
  .qual-yes{ color:var(--green-2); font-weight:600; }
  .qual-no{ color:var(--hot); font-weight:600; }
  .qual-blank{ color:var(--ink-3); }
  .pager{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding-top:12px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-3);
  }
  .pager button{
    font-family:var(--sans); font-size:12.5px; padding:6px 12px; border-radius:7px;
    border:1px solid var(--line-2); background:var(--surface); color:var(--ink); cursor:pointer;
  }
  .pager button:disabled{ opacity:.4; cursor:default; }
  .pager button:hover:not(:disabled){ background:var(--surface-2); }

  @media (max-width:760px){
    .kpis{ grid-template-columns:1fr 1fr; }
    .grid-2{ grid-template-columns:1fr; }
    .source-row{ grid-template-columns:100px 1fr 50px 44px; gap:8px; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <h1>VA Capital</h1>
        <span class="tag">Lead Performance</span>
      </div>
      <div class="meta-line">
        <span id="sources-line">—</span>
        <span id="demo-flag-slot"></span>
        <button id="refresh-btn" class="refresh-btn">↻ Refresh</button>
      </div>
    </div>
  </div>

  <div class="wrap">

    <div class="range-toggle" id="range-toggle"></div>
    <p class="summary-line" id="summary-line"></p>

    <div class="kpis" id="kpis"></div>

    <div class="card">
      <div class="card-head"><span class="card-title">By broker</span></div>
      <div class="card-body"><table class="data" id="broker-table"></table></div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-head"><span class="card-title">By source</span></div>
        <div class="card-body" id="source-list"></div>
      </div>
      <div class="card">
        <div class="card-head"><span class="card-title">Why leads don't qualify</span></div>
        <div class="card-body" id="reason-list"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><span class="card-title">Deal type</span></div>
      <div class="card-body"><div class="chart-wrap" style="height:200px;"><canvas id="typeChart"></canvas></div></div>
    </div>

    <div class="card">
      <div class="card-head"><span class="card-title">Weekly volume</span></div>
      <div class="card-body"><div class="chart-wrap"><canvas id="weekChart"></canvas></div></div>
    </div>

    <div class="card">
      <div class="card-head"><span class="card-title">All leads</span><span id="leads-count" class="empty-note"></span></div>
      <div class="card-body">
        <div class="filters" id="filters"></div>
        <div class="tablewrap"><table class="data leads-table" id="leads-table"></table></div>
        <div class="pager" id="pager"></div>
      </div>
    </div>

    <div class="foot" id="foot-generated">—</div>

  </div>

<script>
const BROKER_COLORS = ['#0F7A43', '#1D5FA8', '#B45309', '#C2410C', '#6E7C76'];

function rateClass(r){
  if (r >= 0.7) return 'good';
  if (r >= 0.4) return 'warn';
  return 'low';
}
function pct(x){ return (x*100).toFixed(1) + '%'; }

// ---------------------------------------------------------------------------
// Refresh endpoint: the Cloudflare Worker that triggers the GitHub Action.
// Leave as null to make the button a plain re-fetch (no Box pull).
// Once the Worker is deployed, paste its URL here, e.g.
//   const REFRESH_ENDPOINT = "https://va-refresh.sdarvishi.workers.dev";
// ---------------------------------------------------------------------------
const REFRESH_ENDPOINT = "https://leadrefresh.sdarvishi.workers.dev";

let weekChartInstance = null;
let typeChartInstance = null;

function setBtn(text, disabled){
  const b = document.getElementById('refresh-btn');
  b.textContent = text;
  b.disabled = !!disabled;
}

// Kick off the GitHub Action, then poll until the JSON's generated_at changes.
async function triggerRebuild(){
  const before = document.getElementById('foot-generated').dataset.generatedAt || '';

  setBtn('↻ Starting…', true);
  try{
    const res = await fetch(REFRESH_ENDPOINT, { method:'POST' });
    const body = await res.json().catch(()=>({}));
    if (!res.ok || !body.ok){
      setBtn('↻ Refresh failed', false);
      console.error('Refresh trigger failed:', body);
      setTimeout(()=>setBtn('↻ Refresh', false), 4000);
      return;
    }
  }catch(err){
    setBtn('↻ Refresh failed', false);
    console.error(err);
    setTimeout(()=>setBtn('↻ Refresh', false), 4000);
    return;
  }

  // The Action takes ~30-60s: pull from Box, rebuild JSON, commit, publish.
  const started = Date.now();
  const TIMEOUT_MS = 180000;   // 3 minutes
  const POLL_MS = 6000;

  while (Date.now() - started < TIMEOUT_MS){
    const secs = Math.round((Date.now()-started)/1000);
    setBtn(`↻ Rebuilding… ${secs}s`, true);
    await new Promise(r => setTimeout(r, POLL_MS));
    try{
      const res = await fetch('dashboard_data.json?t=' + Date.now(), {cache:'no-store'});
      const fresh = await res.json();
      if (fresh.generated_at && fresh.generated_at !== before){
        await load(true);
        setBtn('↻ Updated', false);
        setTimeout(()=>setBtn('↻ Refresh', false), 3000);
        return;
      }
    }catch(e){ /* keep polling */ }
  }

  setBtn('↻ Timed out', false);
  setTimeout(()=>setBtn('↻ Refresh', false), 4000);
}

async function load(isRefresh){
  if (isRefresh) setBtn('↻ Loading…', true);

  let data;
  try{
    const res = await fetch('dashboard_data.json?t=' + Date.now(), {cache:'no-store'});
    data = await res.json();
  }catch(e){
    document.querySelector('.wrap').innerHTML =
      '<div class="card"><div class="card-head"><span class="card-title">Statement unavailable</span></div>' +
      '<div class="card-body"><p class="empty-note">dashboard_data.json could not be loaded. Check that the pipeline ran and the file sits alongside this page.</p></div></div>';
    setBtn('↻ Refresh', false);
    return;
  }

  const genDate = new Date(data.generated_at);
  document.getElementById('sources-line').textContent =
    'Sources: ' + (data.sources_read_ok.join(', ') || 'none');
  if (data.demo_mode){
    document.getElementById('demo-flag-slot').innerHTML = '<span class="demo-flag">Demo data</span>';
  }
  document.getElementById('foot-generated').dataset.generatedAt = data.generated_at || '';
  document.getElementById('foot-generated').textContent =
    'Generated ' + genDate.toLocaleString('en-US', {dateStyle:'medium', timeStyle:'short'}) +
    (data.errors.length ? '  ·  ' + data.errors.length + ' source error(s)' : '');

  // ---- Range toggle: derive KPIs/broker/source/reasons from filtered leads ----
  const REASONS_ORDER = ["Insufficient Funds/Equity","Not Serious/Just Browsing",
    "Residential Only (Not Multi-Res/Commercial)","Wrong Deal Size or Type",
    "Timing Not Ready","Unreachable","Other"];

  const datedLeads = data.leads.filter(l => l.date);

  // Parse "YYYY-MM-DD" as a LOCAL date. new Date("2026-08-24") parses as UTC
  // midnight, which in a negative-offset timezone (e.g. Montreal, UTC-4) lands
  // on the previous day locally and silently pushes leads into the wrong week.
  function parseYMD(s){
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function toYMD(dt){
    const p = n => String(n).padStart(2,'0');
    return `${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())}`;
  }

  const maxDateStr = datedLeads.length
    ? datedLeads.reduce((a,l)=> l.date > a ? l.date : a, datedLeads[0].date)
    : null;
  const maxDate = maxDateStr ? parseYMD(maxDateStr) : null;

  function mondayOf(d){
    const day = (d.getDay()+6)%7; // Mon=0..Sun=6
    return new Date(d.getFullYear(), d.getMonth(), d.getDate()-day);
  }
  function inRange(dateStr, range){
    if (range === 'all') return true;
    if (!maxDate || !dateStr) return false;
    if (range === 'week'){
      const mon = mondayOf(maxDate);
      const sat = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()+5);
      return dateStr >= toYMD(mon) && dateStr <= toYMD(sat);
    }
    if (range === 'month'){
      const start = new Date(maxDate.getFullYear(), maxDate.getMonth(), maxDate.getDate()-29);
      return dateStr >= toYMD(start) && dateStr <= maxDateStr;
    }
    return true;
  }

  let currentRange = 'week';

  function rangeLabel(range){
    if (range==='week') return 'Last work week';
    if (range==='month') return 'Last 30 days';
    return 'All time';
  }

  function renderRangeToggle(){
    document.getElementById('range-toggle').innerHTML = `
      <button class="range-btn ${currentRange==='week'?'active':''}" data-r="week">Last work week</button>
      <button class="range-btn ${currentRange==='month'?'active':''}" data-r="month">Month</button>
      <button class="range-btn ${currentRange==='all'?'active':''}" data-r="all">All time</button>
      <span class="range-note">${rangeLabel(currentRange)}${maxDate?' · through '+maxDate.toISOString().slice(0,10):''}</span>
    `;
    document.querySelectorAll('.range-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{ currentRange = btn.dataset.r; renderRangeToggle(); renderSummary(); });
    });
  }

  function renderSummary(){
    const scoped = data.leads.filter(l => inRange(l.date, currentRange));

    const total = scoped.length;
    const responded = scoped.filter(l=>l.responded==='Yes').length;
    const qualified = scoped.filter(l=>l.qualified==='Yes').length;
    const brokerCount = new Set(scoped.map(l=>l.broker)).size;

    const rangePrefix = currentRange==='week' ? 'This work week' : currentRange==='month' ? 'In the last 30 days' : 'All time';
    document.getElementById('summary-line').innerHTML =
      `${rangePrefix}: <b>${total}</b> new lead${total===1?'':'s'}, <b>${responded}</b> responded (<b>${pct(total?responded/total:0)}</b>).`;

    const owns = scoped.filter(l=>l.owns_commercial==='Yes').length;
    const newToCommercial = scoped.filter(l=>l.owns_commercial==='No').length;

    document.getElementById('kpis').innerHTML = `
      <div class="kpi">
        <div class="label">Total leads</div>
        <div class="value">${total}</div>
        <div class="sub">across ${brokerCount} broker${brokerCount===1?'':'s'}</div>
      </div>
      <div class="kpi">
        <div class="label">Responded</div>
        <div class="value accent">${responded}</div>
        <div class="sub up">${pct(total?responded/total:0)} response rate</div>
      </div>
      <div class="kpi">
        <div class="label">Own commercial property</div>
        <div class="value">${owns}</div>
        <div class="sub">${pct(total?owns/total:0)} of leads</div>
      </div>
      <div class="kpi">
        <div class="label">New to commercial</div>
        <div class="value">${newToCommercial}</div>
        <div class="sub">${pct(total?newToCommercial/total:0)} of leads</div>
      </div>
    `;

    const brokers = [...new Set(scoped.map(l=>l.broker))].sort();
    let rows = brokers.map(b => {
      const bRows = scoped.filter(l=>l.broker===b);
      const n = bRows.length;
      const resp = bRows.filter(l=>l.responded==='Yes').length;
      const own = bRows.filter(l=>l.owns_commercial==='Yes').length;
      return `<tr>
        <td>${b}</td><td>${n}</td><td>${resp}</td>
        <td><span class="badge ${rateClass(n?resp/n:0)}">${pct(n?resp/n:0)}</span></td>
        <td>${own}</td>
        <td><span class="badge ${rateClass(n?own/n:0)}">${pct(n?own/n:0)}</span></td>
      </tr>`;
    }).join('');
    rows += `<tr class="total">
      <td>Total</td><td>${total}</td><td>${responded}</td>
      <td>${pct(total?responded/total:0)}</td><td>${owns}</td>
      <td>${pct(total?owns/total:0)}</td>
    </tr>`;
    document.getElementById('broker-table').innerHTML = `
      <thead><tr>
        <th>Broker</th><th>Leads</th><th>Responded</th><th>Resp. rate</th><th>Own Property</th><th>Ownership rate</th>
      </tr></thead><tbody>${rows}</tbody>`;

    const sources = [...new Set(scoped.map(l=>l.source).filter(Boolean))];
    const sourceStats = sources.map(s=>{
      const sRows = scoped.filter(l=>l.source===s);
      const n = sRows.length;
      const resp = sRows.filter(l=>l.responded==='Yes').length;
      return { source:s, leads:n, response_rate: n?resp/n:0 };
    }).sort((a,b)=>b.leads-a.leads);
    const maxSourceLeads = Math.max(...sourceStats.map(s=>s.leads), 1);
    document.getElementById('source-list').innerHTML = sourceStats.length
      ? sourceStats.map(s => `
        <div class="source-row">
          <div class="source-name">${s.source}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(s.leads/maxSourceLeads*100).toFixed(0)}%"></div></div>
          <div class="source-count">${s.leads}</div>
          <div class="source-rate">${pct(s.response_rate)}</div>
        </div>`).join('')
      : '<p class="empty-note">No leads in this range.</p>';

    const reasonCounts = REASONS_ORDER.map(r => ({
      reason:r, count: scoped.filter(l=>l.reason===r).length
    })).filter(r=>r.count>0).sort((a,b)=>b.count-a.count);
    document.getElementById('reason-list').innerHTML = reasonCounts.length
      ? reasonCounts.map(r => `
          <div class="reason-row"><span>${r.reason}</span><span class="reason-count">${r.count}</span></div>`).join('')
      : '<p class="empty-note">No disqualifications logged yet in this range.</p>';

    // ---- Deal type chart (Acquisition / Construction / Refinance / Other), scoped to range ----
    const TYPE_ORDER = ['Acquisition','Construction','Refinance','Other'];
    const typeCounts = TYPE_ORDER.map(t => scoped.filter(l => l.type === t).length);

    if (typeChartInstance) typeChartInstance.destroy();
    const typeCtx = document.getElementById('typeChart').getContext('2d');
    typeChartInstance = new Chart(typeCtx, {
      type: 'bar',
      data: {
        labels: TYPE_ORDER,
        datasets: [{
          data: typeCounts,
          backgroundColor: ['#0F7A43','#1D5FA8','#B45309','#6E7C76'],
          borderRadius: 6,
          maxBarThickness: 60
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid:{display:false}, ticks:{font:{family:"'Inter'", size:12}, color:'#41504A'} },
          y: { beginAtZero:true, ticks:{precision:0, font:{family:"'Inter'", size:11}, color:'#6E7C76'}, grid:{color:'#E3E7E4'} }
        }
      }
    });
  }

  renderRangeToggle();
  renderSummary();

  // ---- Weekly chart (always full history — a one-week or 30-day trend isn't useful) ----
  const brokers = [...new Set(data.leads.map(l=>l.broker))].sort();
  const ctx = document.getElementById('weekChart').getContext('2d');
  if (weekChartInstance) weekChartInstance.destroy();
  weekChartInstance = new Chart(ctx, {
    type:'line',
    data:{
      labels: data.by_week.map(w=>w.week_of),
      datasets: brokers.map((b,i) => ({
        label:b,
        data:data.by_week.map(w=>w[b]||0),
        borderColor:BROKER_COLORS[i%BROKER_COLORS.length],
        backgroundColor:BROKER_COLORS[i%BROKER_COLORS.length]+'1A',
        borderWidth:2,
        pointRadius:3,
        pointBackgroundColor:BROKER_COLORS[i%BROKER_COLORS.length],
        tension:0.25,
        fill:false
      }))
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{ position:'bottom', labels:{ font:{family:"'Inter'", size:11.5}, color:'#41504A', boxWidth:9, usePointStyle:true } }
      },
      scales:{
        x:{ grid:{display:false}, ticks:{font:{family:"'Inter'", size:11}, color:'#6E7C76'} },
        y:{ beginAtZero:true, grid:{color:'#E3E7E4'}, ticks:{font:{family:"'Inter'", size:11}, color:'#6E7C76'} }
      }
    }
  });

  // ---- Leads table: filters + pagination ----
  const leads = data.leads;
  const uniq = (key) => [...new Set(leads.map(l => l[key]).filter(Boolean))].sort();

  let state = { broker:'', source:'', responded:'', qualified:'', owns:'', search:'', page:1, pageSize:25 };

  function fieldSelect(id, label, options){
    return `<select id="${id}"><option value="">${label}: All</option>` +
      options.map(o=>`<option value="${o}">${o}</option>`).join('') + `</select>`;
  }

  document.getElementById('filters').innerHTML = `
    ${fieldSelect('f-broker','Broker', uniq('broker'))}
    ${fieldSelect('f-source','Source', uniq('source'))}
    ${fieldSelect('f-responded','Responded', ['Yes','No'])}
    ${fieldSelect('f-owns','Owns Property', ['Yes','No'])}
    <input id="f-search" type="text" placeholder="Search name or company…">
  `;

  ['f-broker','f-source','f-responded','f-owns'].forEach(id => {
    document.getElementById(id).addEventListener('change', e => {
      const key = id.replace('f-','');
      state[key] = e.target.value; state.page = 1; renderTable();
    });
  });
  document.getElementById('f-search').addEventListener('input', e => {
    state.search = e.target.value.toLowerCase(); state.page = 1; renderTable();
  });

  function filteredLeads(){
    return leads.filter(l =>
      (!state.broker || l.broker === state.broker) &&
      (!state.source || l.source === state.source) &&
      (!state.responded || l.responded === state.responded) &&
      (!state.owns || l.owns_commercial === state.owns) &&
      (!state.search ||
        (l.name||'').toLowerCase().includes(state.search) ||
        (l.company||'').toLowerCase().includes(state.search))
    );
  }

  function qualClass(v){
    if (v === 'Yes') return 'qual-yes';
    if (v === 'No') return 'qual-no';
    return 'qual-blank';
  }

  function renderTable(){
    const rows = filteredLeads();
    document.getElementById('leads-count').textContent = `${rows.length} of ${leads.length} leads`;

    const start = (state.page-1) * state.pageSize;
    const pageRows = rows.slice(start, start + state.pageSize);

    document.getElementById('leads-table').innerHTML = `
      <thead><tr>
        <th>Date</th><th>Broker</th><th>Lead name</th><th>Company</th>
        <th>Prospect Type</th><th>Deal Type</th><th>Source</th><th>Responded</th><th>Owns Property</th><th>Qualified</th><th>Reason</th>
      </tr></thead>
      <tbody>${pageRows.map(l => `
        <tr>
          <td>${l.date || '—'}</td>
          <td>${l.broker}</td>
          <td>${l.name}</td>
          <td>${l.company || '—'}</td>
          <td>${l.prospect_type || '—'}</td>
          <td>${l.type || '—'}</td>
          <td>${l.source || '—'}</td>
          <td class="${qualClass(l.responded)}">${l.responded || '—'}</td>
          <td class="${qualClass(l.owns_commercial)}">${l.owns_commercial || '—'}</td>
          <td class="${qualClass(l.qualified)}">${l.qualified || '—'}</td>
          <td>${l.reason || '—'}</td>
        </tr>`).join('') || `<tr><td colspan="11" class="empty-note">No leads match these filters.</td></tr>`}
      </tbody>`;

    const totalPages = Math.max(1, Math.ceil(rows.length / state.pageSize));
    document.getElementById('pager').innerHTML = `
      <span>Page ${state.page} of ${totalPages}</span>
      <div>
        <button id="prev-page" ${state.page<=1?'disabled':''}>← Previous</button>
        <button id="next-page" ${state.page>=totalPages?'disabled':''}>Next →</button>
      </div>`;
    const prevBtn = document.getElementById('prev-page');
    const nextBtn = document.getElementById('next-page');
    if (prevBtn) prevBtn.addEventListener('click', () => { state.page--; renderTable(); });
    if (nextBtn) nextBtn.addEventListener('click', () => { state.page++; renderTable(); });
  }

  renderTable();

  setBtn('↻ Refresh', false);
}

document.getElementById('refresh-btn').addEventListener('click', () => {
  if (REFRESH_ENDPOINT) triggerRebuild();
  else load(true);
});
load(false);
</script>
</body>
</html>
