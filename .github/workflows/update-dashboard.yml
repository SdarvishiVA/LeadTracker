name: Update Lead Dashboard

on:
  schedule:
    # 11:00 UTC = 7:00am Montreal (EDT) / 6:00am (EST) — adjust as you like
    - cron: '0 11 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openpyxl requests

      - name: Run aggregator
        env:
          BOX_CLIENT_ID: ${{ secrets.BOX_CLIENT_ID }}
          BOX_CLIENT_SECRET: ${{ secrets.BOX_CLIENT_SECRET }}
          BOX_ENTERPRISE_ID: ${{ secrets.BOX_ENTERPRISE_ID }}
        run: python scripts/aggregate.py

      - name: Commit updated data
        run: |
          git config user.name "lead-dashboard-bot"
          git config user.email "actions@github.com"
          git add dashboard_data.json
          git diff --quiet --cached || git commit -m "Update dashboard data $(date -u +%Y-%m-%d)"
          git push
